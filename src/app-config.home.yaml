app:
  title: Backstage Portal
  baseUrl: ${BACKSTAGE_APP_URL}

backend:
  baseUrl: ${BACKSTAGE_BACKEND_URL}
  database:
    connection:
      ssl: null

auth:
  environment: home
  # Homepage info hub prerequisites:
  # - Google provider is required for sign-in and the "Today's Calendar" widget.
  # - GitHub provider is required for personal GitHub work widgets.
  providers:
    guest: null
    google:
      home:
        clientId: ${AUTH_GOOGLE_CLIENT_ID}
        clientSecret: ${AUTH_GOOGLE_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: emailMatchingUserEntityProfileEmail
    github:
      home:
        clientId: ${GITHUB_AUTH_CLIENT_ID}
        clientSecret: ${GITHUB_AUTH_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: emailMatchingUserEntityProfileEmail
